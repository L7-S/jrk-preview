      <stop offset="50%" stop-color="#38b6ea" />
      <stop offset="85%" stop-color="#8ed8f8" />
      <stop offset="100%" stop-color="#0093dd" />
    </linearGradient>

    <!-- Flame Band 3 (Outer Right Ribbon - Light Cyan Highlight to Deep Blue Tip) -->
